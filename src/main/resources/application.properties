# Configuracion de Spring Boot
spring.application.name=salchichat

# Importar el archivo .env de la raíz de forma nativa
spring.config.import=optional:file:.env[.properties]

# Configuracion de la Base de Datos (MySQL XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/salchichat_db?serverTimezone=UTC
spring.datasource.username=salchi_user
spring.datasource.password=SalchiPass123*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Evitar el warning de open-in-view
spring.jpa.open-in-view=false

# Configuración de Spring AI Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
# Modelos a usar gemini-2.5-flash y gemini-3.5-flash

# Configuración del Bot de Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# Puerto dinámico para despliegues en la nube (Render)
server.port=${PORT:8080}
